<!-- @dsCard group="Brand" viewport="700x160" name="Radius & Elevation" subtitle="Conservative rounding, low-contrast shadows" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;display:flex;gap:14px;background:var(--surface-page);font-family:var(--font-body);font-size:11px;}
.box{width:100px;height:100px;background:var(--surface-card);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;color:var(--text-secondary);}
</style>
<div class="box" style="border-radius:var(--radius-xs);box-shadow:var(--shadow-xs)">xs / xs</div>
<div class="box" style="border-radius:var(--radius-sm);box-shadow:var(--shadow-sm)">sm / sm</div>
<div class="box" style="border-radius:var(--radius-md);box-shadow:var(--shadow-md)">md / md</div>
<div class="box" style="border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)">lg / lg</div>
<div class="box" style="border-radius:var(--radius-full);box-shadow:var(--shadow-sm)">full</div>
