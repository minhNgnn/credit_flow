<!-- @dsCard group="CRM" viewport="1440x840" name="SHB CRM" subtitle="Login, dashboard, customer profile, deal pipeline" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SHB CRM</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="LoginScreen.jsx"></script>
<script type="text/babel" src="DashboardScreen.jsx"></script>
<script type="text/babel" src="DealsScreen.jsx"></script>
<script type="text/babel" src="CustomerProfileScreen.jsx"></script>
<style>
  body { margin: 0; }
  #root { height: 100vh; overflow: auto; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function App() {
  const [loggedIn, setLoggedIn] = React.useState(false);
  const [nav, setNav] = React.useState('dashboard');
  const [customer, setCustomer] = React.useState(null);

  if (!loggedIn) {
    return <LoginScreen onLogin={() => setLoggedIn(true)} />;
  }

  const titles = { dashboard: 'Dashboard', deals: 'Deals', customers: 'Customers', accounts: 'Accounts', reports: 'Reports' };

  let content;
  if (customer) {
    content = <CustomerProfileScreen customer={customer} onBack={() => setCustomer(null)} />;
  } else if (nav === 'deals') {
    content = <DealsScreen />;
  } else if (nav === 'dashboard' || nav === 'customers') {
    content = <DashboardScreen onOpenCustomer={setCustomer} />;
  } else {
    content = <div style={{ padding: 40, color: 'var(--text-tertiary)', fontFamily: 'var(--font-body)' }}>{titles[nav]} — not built in this proposal yet.</div>;
  }

  return (
    <div style={{ display: 'flex', height: '100vh', background: 'var(--surface-page)' }}>
      <Sidebar active={customer ? 'customers' : nav} onNavigate={(k) => { setNav(k); setCustomer(null); }} />
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'auto' }}>
        <div style={{ height: 3, background: 'var(--brand-primary)' }} />
        <TopBar title={customer ? customer.name : titles[nav]} />
        {content}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
