<!-- @dsCard group="Colors" viewport="700x160" name="Brand Colors" subtitle="Navy + orange sampled from the SHB logo" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;font-family:var(--font-body);background:var(--surface-card);}
  .row{display:flex;gap:10px;}
  .sw{flex:1;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:90px;box-shadow:var(--shadow-xs);}
  .sw span{font-size:11px;font-family:var(--font-mono);}
</style>
<div class="row">
  <div class="sw" style="background:var(--color-navy-900);color:#fff"><span>navy-900</span></div>
  <div class="sw" style="background:var(--color-navy-700);color:#fff"><span>navy-700 (logo)</span></div>
  <div class="sw" style="background:var(--color-navy-500);color:#fff"><span>navy-500</span></div>
  <div class="sw" style="background:var(--color-navy-300);color:var(--text-primary)"><span>navy-300</span></div>
  <div class="sw" style="background:var(--color-navy-100);color:var(--text-primary)"><span>navy-100</span></div>
  <div class="sw" style="background:var(--color-orange-700);color:#fff"><span>orange-700</span></div>
  <div class="sw" style="background:var(--color-orange-600);color:#fff"><span>orange-600 (logo)</span></div>
  <div class="sw" style="background:var(--color-orange-300);color:var(--text-primary)"><span>orange-300</span></div>
  <div class="sw" style="background:var(--color-orange-100);color:var(--text-primary)"><span>orange-100</span></div>
</div>
