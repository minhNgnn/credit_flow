<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;font-family:var(--font-body);background:var(--surface-page);display:flex;gap:10px;}
  .box{flex:1;border-radius:var(--radius-md);padding:12px;font-size:12px;height:88px;}
</style>
<div class="box" style="background:var(--surface-page);border:1px solid var(--border-subtle)">page<br><span style="color:var(--text-secondary)">secondary text</span></div>
<div class="box" style="background:var(--surface-card);box-shadow:var(--shadow-sm)">card<br><span style="color:var(--text-tertiary)">tertiary text</span></div>
<div class="box" style="background:var(--surface-sunken)">sunken</div>
<div class="box" style="background:var(--surface-inverse);color:var(--text-on-brand)">inverse</div>
<div class="box" style="background:var(--surface-accent-soft)">accent-soft</div>
