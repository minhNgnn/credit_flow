# Model tiering (ai-architecture.md §7) — a slot, not a hard-coded provider.
# Swap provider/model here; agent code never imports a provider SDK directly,
# it only calls worker/app/llm/adapter.py::complete(tier=...).
tiers:
  fast:
    provider: openai   # OpenRouter (OpenAI-compatible) - set OPENAI_BASE_URL=https://openrouter.ai/api/v1 in .env
    model: openai/gpt-4o-mini
    max_tokens: 4096
  reasoning:
    provider: openai
    model: openai/gpt-4o-mini
    max_tokens: 8192
  # Lát 2 — trích xuất field từ tài liệu RM nộp (structured output qua
  # complete_json()). Cùng OPENAI_BASE_URL/OPENAI_API_KEY (FPT AI Factory),
  # model riêng vì đây là tác vụ trích xuất, không phải tạo văn bản dài.
  extraction:
    provider: openai
    model: openai/gpt-4o-mini
    max_tokens: 2048

budget:
  max_tokens_per_run: 400000
  max_cost_per_run_usd: 2.00
