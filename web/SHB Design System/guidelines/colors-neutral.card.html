<!-- @dsCard group="Colors" viewport="700x160" name="Neutral Scale" subtitle="Cool gray tinted toward navy" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;font-family:var(--font-body);background:var(--surface-card);}
  .row{display:flex;gap:6px;}
  .sw{flex:1;border-radius:var(--radius-sm);height:90px;display:flex;align-items:flex-end;padding:8px;border:1px solid var(--border-subtle);}
  .sw span{font-size:10px;font-family:var(--font-mono);}
</style>
<div class="row">
  <div class="sw" style="background:var(--color-gray-900)"><span style="color:#fff">900</span></div>
  <div class="sw" style="background:var(--color-gray-700)"><span style="color:#fff">700</span></div>
  <div class="sw" style="background:var(--color-gray-500)"><span style="color:#fff">500</span></div>
  <div class="sw" style="background:var(--color-gray-400)"><span>400</span></div>
  <div class="sw" style="background:var(--color-gray-300)"><span>300</span></div>
  <div class="sw" style="background:var(--color-gray-200)"><span>200</span></div>
  <div class="sw" style="background:var(--color-gray-100)"><span>100</span></div>
  <div class="sw" style="background:var(--color-gray-50)"><span>50</span></div>
  <div class="sw" style="background:var(--color-white)"><span>white</span></div>
</div>
