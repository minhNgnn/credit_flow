<link rel="stylesheet" href="styles.css">
<style>

  body{width:1280px;height:854px;display:flex;font-family:var(--font-display);overflow:hidden;}
  .main{flex:1;background:var(--color-orange-600);display:flex;align-items:center;justify-content:center;}
  .main img{width:640px;filter:brightness(0) invert(1);}
  .strip{width:170px;height:854px;display:flex;flex-direction:column;}
  .strip div{flex:1;}
</style>
<div class="main"><img src="assets/logo/shb-logo.png" alt=""></div>
<div class="strip">
  <div style="background:var(--color-orange-300)"></div>
  <div style="background:var(--color-navy-500)"></div>
  <div style="background:var(--color-navy-700)"></div>
  <div style="background:var(--color-navy-900)"></div>
</div>
